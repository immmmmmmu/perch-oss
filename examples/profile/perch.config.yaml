# EDIT THIS FILE
# Demo profile used by the repository-level Cloudflare Pages preview workflow.
# OSS users should run `perch new <project>` and edit their generated copy.

profile:
  name: 'perch demo'
  bio: 'A self-hosted, RSS-powered profile page.'
  markdown: './profile.md'
  # avatarUrl: "./public/avatar.png"
  links:
    - label: 'GitHub'
      href: 'https://github.com/immmmmmmu/perch-oss'
      description: 'Source code, issues, and release history.'
    - label: 'Docs'
      href: 'https://github.com/immmmmmmu/perch-oss#readme'
      description: 'Setup notes for building a self-hosted profile.'

site:
  title: 'perch demo'
  description: 'A living profile page generated by perch.'
  # url: "https://perch-profile-preview.pages.dev"
  ogImage: './public/og.svg'
  favicon: './public/favicon.svg'

locale: ja
theme: editorial

feeds:
  - url: 'https://github.blog/feed/'
    name: 'GitHub Blog'
