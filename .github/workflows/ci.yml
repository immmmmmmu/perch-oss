name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile i18n (Paraglide)
        run: pnpm i18n:compile

      # @perch-app/core ships built artifacts (dist/); downstream type resolution
      # needs them present before lint runs in typed mode.
      - name: Build @perch-app/core (so downstream types resolve)
        run: pnpm --filter @perch-app/core build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # Run the workspace as one suite without coverage here, and gate coverage
      # thresholds on OSS packages only via a separate step.
      - name: Test
        run: pnpm test

      - name: OSS coverage (@perch-app/core, @perch-app/i18n)
        run: pnpm --filter @perch-app/core --filter @perch-app/i18n exec vitest run --coverage

      - name: Build
        run: pnpm build

      - name: Bun typecheck of @perch-app/cli
        run: bun --bun tsc --noEmit --project packages/cli/tsconfig.json
