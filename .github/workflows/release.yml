name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Changesets — Version PR or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build OSS packages
        run: pnpm --filter "@perch-app/*" build

      # TASK-0019 (OSS v0.1):
      #   `publish` arg is dynamically gated on NPM_TOKEN. When the @perch-app npm
      #   scope is registered and the `NPM_TOKEN` repo secret is set, the
      #   changesets action runs `pnpm changeset:publish` (which uses
      #   provenance=true from .npmrc). When NPM_TOKEN is unset, `publish` is
      #   empty. With the current zero pending changesets that makes this job a
      #   no-op; with NPM_TOKEN present, the next main push publishes the
      #   existing package versions directly.
      - name: Notify publish gating
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice title=publish disabled::NPM_TOKEN not set — no pending changesets, so release is a no-op."
            echo "Register @perch-app npm scope + add NPM_TOKEN to repo secrets to enable publish."
          else
            echo "::notice title=publish enabled::NPM_TOKEN present — no pending changesets, so existing versions publish on this main push."
          fi

      - name: Release (Version PR or Publish)
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset:version
          publish: ${{ secrets.NPM_TOKEN != '' && 'pnpm changeset:publish' || '' }}
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
